<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aborvaa's Memory Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-16">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex justify-between items-center">
        <h1 class="text-xl font-bold bg-gradient-to-r from-pink-500 to-violet-500 bg-clip-text text-transparent">Aborvaa's Gallery</h1>
        <div class="flex gap-2">
            <button onclick="switchTab('all')" id="btn-all" class="px-3 py-1.5 text-sm font-medium rounded-full bg-violet-600 text-white transition">All</button>
            <button onclick="switchTab('favorites')" id="btn-fav" class="px-3 py-1.5 text-sm font-medium rounded-full bg-slate-800 text-slate-300 transition">Fav (<span id="fav-count">0</span>)</button>
        </div>
    </header>

    <!-- Main Grid -->
    <main class="max-w-md mx-auto p-4">
        <div id="gallery-container" class="flex flex-col gap-6"></div>
    </main>

    <!-- Modal View -->
    <div id="detail-modal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-lg hidden flex flex-col justify-between p-4 overflow-y-auto">
        <div class="flex justify-between items-center py-2">
            <h2 id="modal-title" class="text-lg font-semibold text-violet-400">Memory Details</h2>
            <button onclick="closeModal()" class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-slate-300">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>
        <div class="my-auto flex flex-col items-center">
            <div class="relative w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl border border-slate-800 bg-slate-900">
                <img id="modal-img" src="" alt="Memory" class="w-full h-80 object-cover">
            </div>
        </div>
        <div class="py-2 text-center text-xs text-slate-500">Tap close to go back</div>
    </div>

    <!-- Script with direct placeholder images & viewer -->
    <script>
        const memories = [
            {
                id: 1,
                title: "Flower Drawing Memory",
                realImg: "https://images.unsplash.com/photo-1597848212624-a19eb35e2651?auto=format&fit=crop&w=600&q=80",
                drawingImg: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 2,
                title: "Nature Landscape Memory",
                realImg: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=600&q=80",
                drawingImg: "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 3,
                title: "Cute Bunny Memory",
                realImg: "https://images.unsplash.com/photo-1585110396000-c9ffd4e4b308?auto=format&fit=crop&w=600&q=80",
                drawingImg: "https://images.unsplash.com/photo-1535268647677-300dbf3d78d1?auto=format&fit=crop&w=600&q=80"
            }
        ];

        let currentTab = 'all';
        let favorites = JSON.parse(localStorage.getItem('fav_memories')) || [];

        function renderGallery() {
            const container = document.getElementById('gallery-container');
            container.innerHTML = '';

            let filtered = memories;
            if (currentTab === 'favorites') {
                filtered = memories.filter(m => favorites.includes(m.id));
            }

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-20 text-slate-500 text-sm">No memories found.</div>`;
                return;
            }

            filtered.forEach(mem => {
                const isFav = favorites.includes(mem.id);
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-lg";
                card.innerHTML = `
                    <div class="relative overflow-hidden aspect-square cursor-pointer" onclick="openModal('${mem.realImg}', '${mem.title}')">
                        <img src="${mem.realImg}" alt="${mem.title}" class="w-full h-full object-cover">
                        <div class="absolute top-3 left-3 bg-black/50 backdrop-blur-md px-2.5 py-1 rounded-full text-[10px] text-white font-medium">📸 Real Photo</div>
                    </div>
                    <div class="p-4 flex flex-col gap-3">
                        <div class="flex justify-between items-center">
                            <h3 class="font-semibold text-slate-100 text-sm">${mem.title}</h3>
                            <button onclick="toggleFavorite(${mem.id})" class="text-xl">
                                <i class="${isFav ? 'fa-solid fa-heart text-pink-500' : 'fa-regular fa-heart text-slate-400'}"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
            document.getElementById('fav-count').innerText = favorites.length;
        }

        function toggleFavorite(id) {
            if (favorites.includes(id)) {
                favorites = favorites.filter(f => f !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('fav_memories', JSON.stringify(favorites));
            renderGallery();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('btn-all').className = tab === 'all' ? "px-3 py-1.5 text-sm font-medium rounded-full bg-violet-600 text-white transition" : "px-3 py-1.5 text-sm font-medium rounded-full bg-slate-800 text-slate-300 transition";
            document.getElementById('btn-fav').className = tab === 'favorites' ? "px-3 py-1.5 text-sm font-medium rounded-full bg-violet-600 text-white transition" : "px-3 py-1.5 text-sm font-medium rounded-full bg-slate-800 text-slate-300 transition";
            renderGallery();
        }

        function openModal(url, title) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-img').src = url;
            document.getElementById('detail-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.add('hidden');
        }

        renderGallery();
    </script>
</body>
</html>
